# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "tests/**"
      - "samples/**"
      - ".github/workflows/ci.yml"
      - "Directory.Build.props"
      - "ReverseTunnel.Yarp.sln"
      - "version.json"
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.targets"
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "tests/**"
      - "samples/**"
      - ".github/workflows/ci.yml"
      - "Directory.Build.props"
      - "ReverseTunnel.Yarp.sln"
      - "version.json"
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.targets"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write     # dorny/test-reporter publishes a check run

    steps:
      - uses: actions/checkout@v4
        with:
            fetch-depth: 0 # avoid shallow clone so nbgv can do its work.
      - uses: dotnet/nbgv@master
        id: nbgv
        with:
          setAllVars: true
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        run: dotnet test --no-build --verbosity normal --configuration Release --logger "trx;LogFilePrefix=test-results" --results-directory ./test-results
      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Tests
          path: ./test-results/*.trx
          reporter: dotnet-trx
      - name: Pack All Projects
        run: dotnet pack --configuration Release -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg --output ${{ github.workspace }}/artifacts
      - name: Upload packages
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            ${{ github.workspace }}/artifacts/*.nupkg
            ${{ github.workspace }}/artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 1

  # Publishing runs only for pushes to main. It is isolated in its own job so it can enter
  # the 'CI-preview' environment (required by the nuget.org Trusted Publishing policy)
  # without gating pull-request builds, which never reach this job.
  publish:
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    environment: CI-preview   # must match the nuget.org Trusted Publishing policy
    permissions:
      contents: read
      packages: write   # push to GitHub Packages
      id-token: write   # request the OIDC token for NuGet Trusted Publishing

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts
      - name: Push to GitHub Packages
        run: dotnet nuget push "artifacts/*.nupkg" --skip-duplicate --api-key ${{ secrets.GITHUB_TOKEN }} --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
      - name: NuGet login (OIDC → short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: BoBiene   # nuget.org profile name (package owner); can be moved to ${{ secrets.NUGET_USER }}
      - name: Push to NuGet.org
        run: dotnet nuget push "artifacts/*.nupkg" --skip-duplicate --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

  docker:
    runs-on: ubuntu-latest
    # only run if in 'unifiedfx/UFX.Relay' -> fix for forked repos
    if: ${{ github.repository == 'unifiedfx/UFX.Relay' }}
    steps:
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          file: "samples/Service/Host/Dockerfile"
          push: true
          tags: unifiedfx/ufx.relay.host:latest
