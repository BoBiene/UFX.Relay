name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the GitHub release
  id-token: write   # request the OIDC token for NuGet Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production   # must match the nuget.org Trusted Publishing policy

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required by NBGV to compute the correct version from git history

      - uses: dotnet/nbgv@master
        with:
          setAllVars: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore

      - run: dotnet pack --no-restore --configuration Release -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg

      - name: NuGet login (OIDC → short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: BoBiene   # nuget.org profile name (package owner); can be moved to ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: dotnet nuget push **/Release/*.nupkg --skip-duplicate --api-key ${{ steps.login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          shopt -s globstar nullglob
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            **/Release/*.nupkg \
            **/Release/*.snupkg
